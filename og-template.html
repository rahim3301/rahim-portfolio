<!doctype html>
<!-- Source for public/og-v2.png (the 1200x630 share image). Render: open from the repo root and screenshot #og at 1200x630. -->
<html>
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; box-sizing: border-box; }
      body { background: #14060a; }
      #og {
        width: 1200px; height: 630px; position: relative; overflow: hidden;
        background: #14060a; font-family: "Inter", sans-serif; color: #fff0dc;
      }
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(240, 165, 138, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(240, 165, 138, 0.06) 1px, transparent 1px);
        background-size: 56px 56px;
      }
      .glow { position: absolute; border-radius: 50%; filter: blur(110px); }
      .g1 { width: 560px; height: 560px; background: rgba(121, 11, 19, 0.85); top: -220px; left: -160px; }
      .g2 { width: 460px; height: 460px; background: rgba(255, 154, 92, 0.22); bottom: -200px; right: 120px; }
      .content { position: absolute; left: 72px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
      .who { display: flex; align-items: center; gap: 18px; }
      .who img { width: 84px; height: 84px; border-radius: 22px; object-fit: cover; border: 2px solid rgba(255, 154, 92, 0.7); }
      .badge {
        border: 1px solid rgba(240, 165, 138, 0.35); background: rgba(200, 29, 42, 0.16);
        color: #f6c9ad; border-radius: 999px; padding: 9px 20px; font-size: 19px; font-weight: 600;
      }
      h1 { font-family: "Space Grotesk", sans-serif; font-size: 96px; line-height: 1; font-weight: 700; margin-top: 30px; }
      .grad { background: linear-gradient(110deg, #ff4d4f 0%, #ff7a52 45%, #ffb36b 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .role { font-family: "Space Grotesk", sans-serif; font-size: 34px; font-weight: 600; margin-top: 18px; color: #fff0dc; }
      .games { margin-top: 14px; font-size: 23px; line-height: 1.45; color: #c9ab9b; }
      .games b { color: #ffc89a; font-weight: 600; }
      .art { position: absolute; right: 0; top: 0; width: 560px; height: 630px; }
      .art img { position: absolute; border-radius: 22px; box-shadow: 0 24px 50px -12px rgba(0, 0, 0, 0.75); outline: 2px solid rgba(255, 240, 220, 0.18); }
      .a1 { width: 440px; top: 52px; left: 40px; transform: rotate(-6deg); }
      .a2 { width: 400px; top: 212px; left: 118px; transform: rotate(4deg); }
      .a3 { width: 440px; top: 372px; left: 50px; transform: rotate(-2deg); }
    </style>
  </head>
  <body>
    <div id="og">
      <div class="grid"></div>
      <div class="glow g1"></div>
      <div class="glow g2"></div>
      <div class="content">
        <div class="who">
          <img src="public/me.png" alt="" />
          <span class="badge">Director @ Offroad Interactive</span>
        </div>
        <h1>Rahim <span class="grad">Khan</span></h1>
        <div class="role">Unity Game Developer</div>
        <div class="games">10+ shipped mobile games, 3 built solo:<br /><b>Superhero Maker · Bloop · Kitten Box Parade</b></div>
      </div>
      <div class="art">
        <img class="a1" src="public/renders/superhero-maker.webp" alt="" />
        <img class="a2" src="public/renders/kitten-box-parade.webp" alt="" />
        <img class="a3" src="public/renders/bloop-v3.webp" alt="" />
      </div>
    </div>
  </body>
</html>
