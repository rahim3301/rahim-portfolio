<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.55" stop-color="#a078f0"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
  </defs>
  <!-- Dark rounded tile -->
  <rect width="64" height="64" rx="15" fill="#0d0716"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="13" fill="none" stroke="url(#g)" stroke-width="3"/>
  <!-- Gamepad -->
  <g transform="translate(32 35)">
    <rect x="-17" y="-8" width="34" height="16" rx="8" fill="url(#g)"/>
    <circle cx="-13" cy="-4" r="0" fill="#0d0716"/>
    <!-- D-pad -->
    <rect x="-13.5" y="-1.6" width="8" height="3.2" rx="1" fill="#0d0716"/>
    <rect x="-11.1" y="-4" width="3.2" height="8" rx="1" fill="#0d0716"/>
    <!-- Buttons -->
    <circle cx="8" cy="-2.6" r="1.9" fill="#0d0716"/>
    <circle cx="12.6" cy="0" r="1.9" fill="#0d0716"/>
    <circle cx="8" cy="2.6" r="1.9" fill="#0d0716"/>
    <circle cx="3.4" cy="0" r="1.9" fill="#0d0716"/>
  </g>
  <!-- R initial -->
  <text x="32" y="22" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="url(#g)">RK</text>
</svg>
